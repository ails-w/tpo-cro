# TPT — Configuración por defecto/ejemplo
#
# Los parámetros de los niveles L1 y L2 son PRESETS FIJOS (ADR-004 §5):
# no se configuran acá y no se pueden editar desde la TUI. Se VISUALIZAN
# en la pantalla [C]onfig › Contrato activo.
#
# Lo configurable es: Off/L0 (medición), presets de timer, notificaciones,
# retención de notas y la ELECCIÓN de nivel + término.

[general]
db_path = "~/.local/share/tpt/metrics.db"
socket_path = "$XDG_RUNTIME_DIR/tpt.sock"
notes_retention_days = 365        # 0 = nunca eliminar notas

[timers]
default_preset = "preset-25-5"
max_short_break_minutes = 15      # regla dura
max_long_break_minutes = 20       # regla dura
max_warnings_per_session = 3
# Pomodoro
pomodoro_cycles = 4               # N ciclos; al completarlos la sesión CIERRA (gratis)
require_break_confirmation = true # el siguiente ciclo arranca solo si el usuario confirma
awaiting_expiry_minutes = 45      # si no confirma en X, cierra COMPLETED (sin deuda)
# Vista del modo foco (3 capas, ADR-004)
#   soft   → pantalla completa + beacon + confirmación al salir
#   locked → bloquea la navegación de la TUI durante la sesión
focus_view = "soft"

# Presets ajustables. Regla dura: corto <=15, largo <=20.
[[timer_presets]]
name = "preset-25-5"
work_minutes = 25
short_break_minutes = 5
long_break_minutes = 20
cycles_before_long = 4

[[timer_presets]]
name = "preset-50-10"
work_minutes = 50
short_break_minutes = 10
long_break_minutes = 20
cycles_before_long = 2

[[timer_presets]]
name = "preset-75-12"
work_minutes = 75
short_break_minutes = 12
long_break_minutes = 20
cycles_before_long = 2

[[timer_presets]]
name = "preset-90-15"
work_minutes = 90
short_break_minutes = 15
long_break_minutes = 20
cycles_before_long = 1

[presence]
# Nivel vigente: Off | L0 | L1 | L2
#   Off → sin presencia; acredita todo (cronómetro puro)
#   L0  → mide y descuenta el gap; SIN abortos ni deuda (default amable)
#   L1  → contrato estricto (preset)
#   L2  → contrato duro   (preset)
# Cambiar a L1/L2 exige firmar un término (días/semanas/meses).
level = "L0"

# ---- Medición (aplica a L0; L1/L2 fijan sus propios valores) ----
min_gap_seconds = 420             # 7 min: desde acá el gap existe y cuenta
gap_deduction = "full"            # full = descuenta el gap completo · excess = solo lo que excede
suspend_min_seconds = 60          # una suspensión más corta no aborta; acumula
warn_after_seconds = 180          # aviso suave (3 min)
strong_warn_after_seconds = 300   # aviso fuerte (5 min)
# Los avisos son INFORMATIVOS y se disparan al instante: nunca descuentan tiempo.

# ---- Anti-gaming ----
# Si no hay heartbeat fresco de presencia, no se puede arrancar en L1/L2.
require_heartbeat = true
heartbeat_max_age_seconds = 60

# ---- Contadores ----
abort_counter_window = "contract" # contract | day | session
# L1 y L2 (PRESETS — solo lectura, no editar acá):
#   L1 · gap 7min · aborta 35% · deuda 5min(+1/aborto, tope 20) · challenge +8%(+2%/aborto, tope 40%)
#        · caducidad 15 días · puntaje 1-7 obligatorio · 1 perdón
#   L2 · gap 7min · aborta 25% · lock aborta · crédito 0 si lock o gap único >=30%
#        · deuda 8min(+1/aborto, tope 25) · challenge +15%(+2%/aborto, tope 40%)
#        · caducidad 7 días · puntaje 1-5 obligatorio · notas obligatorias · 0 perdones

[commitment]
min_term_days = 1                 # término mínimo al subir de nivel

[notifications]
desktop = true                    # avisos de inactividad y fin de bloque
sound = true
sound_file = ""                   # vacío = sonido por defecto del sistema
