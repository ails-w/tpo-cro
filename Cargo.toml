[workspace]
resolver = "3"
members = [
    "crates/tpt-core",
    "crates/tpt-daemon",
    "crates/tpt-tui",
    "crates/tpt-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
